name: Release

# On every push to main: if changesets are waiting, open (or update) a "chore: release packages" pull
# request that bumps versions and changelogs. Merging that pull request publishes @easm-ui/ui,
# @easm-ui/icons and @easm-ui/brand to npm (npmjs.com) with provenance. Versions already published
# are skipped. Needs the repository secret NPM_TOKEN (an npm automation token for the @easm-ui org).
on:
  push:
    branches: [main]
  workflow_dispatch: # run it again from the Actions tab

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
