<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1.6 28 13" width="28" height="13" role="img"><title>EASM is writing</title><style>.easm-dots circle{transform-box:fill-box;transform-origin:50% 50%;animation-timing-function:cubic-bezier(.45,0,.55,1);animation-iteration-count:infinite;animation-fill-mode:both}.easm-dots.solid{--easm-dots-lo:1;--easm-dots-sm:.62}.easm-dots[data-variant=typing] circle{animation-name:easm-dots-type;animation-duration:var(--easm-dots-period)}.easm-dots[data-variant=typing] circle:nth-child(2){animation-delay:calc(var(--easm-dots-period) * -.86)}.easm-dots[data-variant=typing] circle:nth-child(3){animation-delay:calc(var(--easm-dots-period) * -.72)}@keyframes easm-dots-type{0%,46%,100%{transform:translateY(0) scale(var(--easm-dots-sm,.84));opacity:var(--easm-dots-lo,.36)}22%{transform:translateY(-2.6px) scale(1);opacity:1}}@media (prefers-reduced-motion:reduce){.easm-dots circle{animation:none!important;opacity:.7}.easm-dots.solid circle{opacity:1}}[data-easm-motion=off] .easm-dots circle{animation:none!important;opacity:.7}[data-easm-motion=off] .easm-dots.solid circle{opacity:1}</style><g class="easm-dots" data-variant="typing" style="--easm-dots-period:1.2s"><circle cx="3" cy="6.9" r="3" fill="#161616"/><circle cx="13" cy="6.9" r="3" fill="#161616"/><circle cx="23" cy="6.9" r="3" fill="#161616"/></g></svg>