<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1.6 28 13" width="28" height="13" role="img"><title>EASM is searching</title><style>.easm-dots circle{transform-box:fill-box;transform-origin:50% 50%;animation-timing-function:cubic-bezier(.45,0,.55,1);animation-iteration-count:infinite;animation-fill-mode:both}.easm-dots.solid{--easm-dots-lo:1;--easm-dots-sm:.62}.easm-dots[data-variant=searching] circle{animation-name:easm-dots-scan;animation-duration:var(--easm-dots-period)}.easm-dots[data-variant=searching] circle:nth-child(2){animation-duration:calc(var(--easm-dots-period) / 2);animation-delay:calc(var(--easm-dots-period) * -.25)}.easm-dots[data-variant=searching] circle:nth-child(3){animation-delay:calc(var(--easm-dots-period) * -.5)}@keyframes easm-dots-scan{0%,100%{transform:scale(1);opacity:1}28%,72%{transform:scale(var(--easm-dots-sm,.84));opacity:var(--easm-dots-lo,.36)}}@media (prefers-reduced-motion:reduce){.easm-dots circle{animation:none!important;opacity:.7}.easm-dots.solid circle{opacity:1}}[data-easm-motion=off] .easm-dots circle{animation:none!important;opacity:.7}[data-easm-motion=off] .easm-dots.solid circle{opacity:1}</style><g class="easm-dots" data-variant="searching" style="--easm-dots-period:1.5s"><circle cx="3" cy="6.9" r="3" fill="#161616"/><circle cx="13" cy="6.9" r="3" fill="#161616"/><circle cx="23" cy="6.9" r="3" fill="#161616"/></g></svg>